name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        run: npm ci

      - name: Deliberate failure-path proof
        run: exit 1

      - name: Run repository quality gate
        run: npm run quality

